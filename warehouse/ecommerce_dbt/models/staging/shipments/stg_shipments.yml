version: 2

models:
  - name: stg_shipments
    description: "Staging view for verified shipment records."

    columns:
      - name: shipment_id
        description: "Unique shipment identifier."
        data_tests:
          - unique
          - not_null

      - name: order_id
        description: "Order associated with this shipment."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: _silver_batch_id
        description: "Source Silver batch identifier."
        data_tests:
          - not_null

      - name: _loaded_at
        description: "Timestamp when the record was loaded into Raw Warehouse."
        data_tests:
          - not_null