version: 2

models:
  - name: stg_customers
    description: "Staging view for verified customer records."

    columns:
      - name: customer_id
        description: "Unique customer identifier."
        data_tests:
          - unique
          - not_null

      - name: _silver_batch_id
        description: "Source Silver batch identifier."
        data_tests:
          - not_null

      - name: _loaded_at
        description: "Timestamp when the record was loaded into Raw Warehouse."
        data_tests:
          - not_null