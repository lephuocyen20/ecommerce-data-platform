version: 2

models:
  - name: dim_customers
    description: "Current-state customer dimension. Grain: one row per customer."

    columns:
      - name: customer_id
        description: "Unique customer identifier and dimension primary key."
        data_tests:
          - unique
          - not_null

      - name: _silver_batch_id
        description: "Source Silver batch identifier for lineage."
        data_tests:
          - not_null

      - name: _loaded_at
        description: "Timestamp when the customer record entered the Raw Warehouse."
        data_tests:
          - not_null