version: 2

models:
  - name: fact_order_items
    description: "Order item-level fact table. Grain: one row per order_item_id."

    columns:
      - name: order_item_id
        description: "Unique order item identifier."
        data_tests:
          - unique
          - not_null

      - name: order_id
        description: "Foreign key to fact_orders."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_orders')
                field: order_id

      - name: product_id
        description: "Foreign key to dim_products."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id

      - name: customer_id
        description: "Foreign key to dim_customers."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: order_date_key
        description: "Integer date key in YYYYMMDD format."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: quantity
        description: "Quantity purchased in this order item."
        data_tests:
          - not_null

      - name: unit_price
        description: "Unit price at the time of purchase."
        data_tests:
          - not_null

      - name: gross_amount
        description: "Quantity multiplied by unit price."
        data_tests:
          - not_null

      - name: discount_amount
        description: "Discount applied to this order item."
        data_tests:
          - not_null

      - name: net_amount
        description: "Gross amount minus discount amount."
        data_tests:
          - not_null

      - name: _silver_batch_id
        description: "Source Silver batch identifier."
        data_tests:
          - not_null

      - name: _loaded_at
        description: "Timestamp when the order item entered the Raw Warehouse."
        data_tests:
          - not_null