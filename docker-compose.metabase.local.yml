name: ecommerce-metabase-local

x-local-bi-contract:
  mode: native-trino-read-only
  jdbc_endpoint: trino-local-overlay
  query_boundary: metabase-native-trino
  runtime_status: native-connection-not-started

services:
  metabase-db:
    image: postgres:16
    profiles: [bi]
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${METABASE_DB_PASSWORD:?METABASE_DB_PASSWORD is required}
    volumes:
      - metabase_metadata:/var/lib/postgresql/data
    networks: [metabase-local]

  metabase:
    image: ${METABASE_IMAGE:-metabase/metabase:v0.55.3}
    profiles: [bi]
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: "5432"
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD:?METABASE_DB_PASSWORD is required}
      MB_DB_HOST: metabase-db
      MB_JETTY_PORT: "3000"
    ports:
      - "127.0.0.1:${METABASE_PORT:-3000}:3000"
    networks: [metabase-local]
    depends_on:
      metabase-db:
        condition: service_started

volumes:
  metabase_metadata:
    name: ecommerce-metabase-metadata-${METABASE_RUN_ID:-dev}

networks:
  metabase-local:
    name: ecommerce-metabase-local-${METABASE_RUN_ID:-dev}
