services:
  spark:
    build:
      context: .
      dockerfile: Dockerfile
    image: ecommerce-spark:3.5.6
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      BRONZE_BUCKET: ${BRONZE_BUCKET}
    container_name: ecommerce-spark
    command: sleep infinity
    env_file:
      - ../.env
    volumes:
      - ../common:/opt/spark/work-dir/common:ro
      - ../silver:/opt/spark/work-dir/silver:ro
      - ../gold:/opt/spark/work-dir/gold:ro
      - ../transformation:/opt/spark/work-dir/transformation
      - ../validation:/opt/spark/work-dir/validation
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    external: true
    name: ecommerce-data-platform_default
