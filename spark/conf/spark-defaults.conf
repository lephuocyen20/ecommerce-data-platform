# Iceberg table support for the local Spark 3.5 runtime.
spark.sql.extensions                                      org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# Nessie tracks Iceberg metadata and Spark uses Hadoop S3A for MinIO data.
spark.sql.catalog.lakehouse                               org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lakehouse.catalog-impl                  org.apache.iceberg.nessie.NessieCatalog
spark.sql.catalog.lakehouse.uri                           http://nessie:19120/api/v2
spark.sql.catalog.lakehouse.ref                           main
spark.sql.catalog.lakehouse.authentication.type           NONE
spark.sql.catalog.lakehouse.warehouse                     s3a://ecommerce-data-lake/lakehouse
spark.sql.catalog.lakehouse.io-impl                       org.apache.iceberg.hadoop.HadoopFileIO

# Nessie namespace metadata can use s3:// while the local object store uses
# Hadoop S3A. Register this mapping before Spark initializes the catalog.
spark.hadoop.fs.s3.impl                                   org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.AbstractFileSystem.s3.impl                 org.apache.hadoop.fs.s3a.S3A
spark.hadoop.fs.s3a.endpoint                               http://minio:9000
spark.hadoop.fs.s3a.impl                                   org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.path.style.access                      true
spark.hadoop.fs.s3a.connection.ssl.enabled                 false
spark.hadoop.fs.s3a.aws.credentials.provider               com.amazonaws.auth.EnvironmentVariableCredentialsProvider
spark.hadoop.fs.s3a.connection.establish.timeout            5000
spark.hadoop.fs.s3a.connection.timeout                      10000
spark.hadoop.fs.s3a.attempts.maximum                        1
spark.hadoop.fs.s3a.retry.limit                             1
