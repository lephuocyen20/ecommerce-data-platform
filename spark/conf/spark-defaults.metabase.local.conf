# Contract-only local BI endpoint configuration; do not use for production.
spark.sql.extensions                                      org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.lakehouse                               org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lakehouse.catalog-impl                  org.apache.iceberg.nessie.NessieCatalog
spark.sql.catalog.lakehouse.uri                           http://nessie:19120/api/v2
spark.sql.catalog.lakehouse.ref                           main
spark.sql.catalog.lakehouse.authentication.type           NONE
spark.sql.catalog.lakehouse.warehouse                     s3a://ecommerce-quality-it/lakehouse
spark.sql.catalog.lakehouse.io-impl                       org.apache.iceberg.hadoop.HadoopFileIO
spark.hadoop.fs.s3.impl                                   org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.AbstractFileSystem.s3.impl                 org.apache.hadoop.fs.s3a.S3A
spark.hadoop.fs.s3a.endpoint                               http://host.docker.internal:9000
spark.hadoop.fs.s3a.path.style.access                      true
spark.hadoop.fs.s3a.connection.ssl.enabled                 false
spark.hadoop.fs.s3a.aws.credentials.provider               com.amazonaws.auth.EnvironmentVariableCredentialsProvider
spark.sql.thriftServer.singleSession                       true
