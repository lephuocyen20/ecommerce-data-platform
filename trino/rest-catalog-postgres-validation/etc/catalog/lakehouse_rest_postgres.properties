connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=${ENV:ICEBERG_POSTGRES_REST_CATALOG_URI}
iceberg.rest-catalog.warehouse=s3://ecommerce-data-lake
iceberg.security=read_only
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.path-style-access=true
s3.region=us-east-1
s3.aws-access-key=${ENV:TRINO_S3_READONLY_ACCESS_KEY}
s3.aws-secret-key=${ENV:TRINO_S3_READONLY_SECRET_KEY}
