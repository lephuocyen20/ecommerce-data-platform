x-airflow-common: &airflow-common
  image: ecommerce-airflow:3.1.7
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@${AIRFLOW_DB_HOST}:${AIRFLOW_DB_PORT}/${AIRFLOW_DB_NAME}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "${AIRFLOW_ADMIN_USERNAME:-admin}:admin"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/auth/simple_auth_manager_passwords.json
    AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-change_this_local_password}
    AIRFLOW_SIMPLE_AUTH_PASSWORDS_FILE: /opt/airflow/auth/simple_auth_manager_passwords.json
    INGESTION_WRITE_ENABLED: "true"

    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-api-server:8080/execution/"
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY}

    DB_HOST: postgres
    DB_PORT: "5432"
    DB_NAME: ecommerce_test
    DB_USER: ecommerce_user
    DB_PASSWORD: ${DB_PASSWORD}

    MINIO_ENDPOINT: minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
    MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    BRONZE_BUCKET: ${BRONZE_BUCKET}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/bootstrap_auth.py:/opt/airflow/bootstrap_auth.py:ro
    - airflow_auth:/opt/airflow/auth
    - ./ingestion:/opt/airflow/project/ingestion
    - ./validation:/opt/airflow/project/validation
    - ./source:/opt/airflow/project/source
    - ./common:/opt/airflow/project/common:ro
    - ./silver:/opt/airflow/project/silver:ro
    - ./gold:/opt/airflow/project/gold:ro
    - ./transformation:/opt/airflow/project/transformation:ro
    - ./staging:/opt/airflow/project/staging
services:
  postgres:
    image: postgres:16
    container_name: ecommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./source/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: ecommerce-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD:  ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  dbt-runner:
    build:
      context: .
      dockerfile: warehouse/dbt.Dockerfile
    environment:
      DBT_PROFILES_DIR: /app/profiles
      DBT_HOST: postgres
      DBT_PORT: "5432"
      DBT_NAME: ecommerce_test
      DBT_USER: ${DB_USER}
      DBT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./warehouse/ecommerce_dbt:/app
      - ./warehouse/dbt_profiles:/app/profiles:ro
    working_dir: /app
    depends_on:
      - postgres
    profiles:
      - dbt

  airflow-init:
    <<: *airflow-common
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        mkdir -p /opt/airflow/logs
        chown 50000:0 /opt/airflow/logs
        chmod 775 /opt/airflow/logs
        python /opt/airflow/bootstrap_auth.py
        PYTHONPATH=/home/airflow/.local/lib/python3.12/site-packages exec airflow db migrate
    volumes:
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/bootstrap_auth.py:/opt/airflow/bootstrap_auth.py:ro
      - airflow_auth:/opt/airflow/auth
      - ./staging:/opt/airflow/project/staging
    depends_on:
      - postgres

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "8085:8080"
    volumes:
    - ./staging:/opt/airflow/project/staging
    - ./airflow/bootstrap_auth.py:/opt/airflow/bootstrap_auth.py:ro
    - airflow_auth:/opt/airflow/auth
    depends_on:
      airflow-init:
        condition: service_completed_successfully
  airflow-scheduler:
    <<: *airflow-common
    environment:
      <<: *airflow-common-env
      WAREHOUSE_WRITE_ENABLED: "false"
      GOLD_SNAPSHOT_WRITE_ENABLED: ${GOLD_SNAPSHOT_WRITE_ENABLED:-false}
      WAREHOUSE_DB_HOST: postgres
      WAREHOUSE_DB_PORT: ${DB_PORT}
      WAREHOUSE_DB_NAME: ${DB_NAME}
      WAREHOUSE_DB_USER: ${DB_USER}
      WAREHOUSE_DB_PASSWORD: ${DB_PASSWORD}
    command: scheduler
    volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/bootstrap_auth.py:/opt/airflow/bootstrap_auth.py:ro
    - airflow_auth:/opt/airflow/auth
    - ./ingestion:/opt/airflow/project/ingestion
    - ./validation:/opt/airflow/project/validation
    - ./source:/opt/airflow/project/source
    - ./common:/opt/airflow/project/common:ro
    - ./silver:/opt/airflow/project/silver:ro
    - ./gold:/opt/airflow/project/gold:ro
    - ./transformation:/opt/airflow/project/transformation:ro
    - /var/run/docker.sock:/var/run/docker.sock
    - ./staging:/opt/airflow/project/staging
    - ./warehouse:/opt/airflow/project/warehouse:ro
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:

    <<: *airflow-common
    environment:
      <<: *airflow-common-env
      WAREHOUSE_DB_HOST: postgres
      WAREHOUSE_DB_PORT: ${DB_PORT}
      WAREHOUSE_DB_NAME: ${DB_NAME}
      WAREHOUSE_DB_USER: ${DB_USER}
      WAREHOUSE_DB_PASSWORD: ${DB_PASSWORD}
    command: dag-processor
    volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/bootstrap_auth.py:/opt/airflow/bootstrap_auth.py:ro
    - airflow_auth:/opt/airflow/auth
    - ./ingestion:/opt/airflow/project/ingestion:ro
    - ./validation:/opt/airflow/project/validation:ro
    - ./source:/opt/airflow/project/source:ro
    - ./common:/opt/airflow/project/common:ro
    - ./silver:/opt/airflow/project/silver:ro
    - ./gold:/opt/airflow/project/gold:ro
    - ./transformation:/opt/airflow/project/transformation:ro
    - ./staging:/opt/airflow/project/staging
    depends_on:
      airflow-init:
        condition: service_completed_successfully
volumes:
  postgres_data:
  minio_data:
  airflow_auth:
