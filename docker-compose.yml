x-airflow-common: &airflow-common
  image: ecommerce-airflow:3.1.7
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@${AIRFLOW_DB_HOST}:${AIRFLOW_DB_PORT}/${AIRFLOW_DB_NAME}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "${AIRFLOW_ADMIN_USERNAME:-admin}:admin"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/auth/simple_auth_manager_passwords.json
    AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-change_this_local_password}
    AIRFLOW_SIMPLE_AUTH_PASSWORDS_FILE: /opt/airflow/auth/simple_auth_manager_passwords.json
    INGESTION_WRITE_ENABLED: "${INGESTION_WRITE_ENABLED:-false}"
    LAKEHOUSE_WRITE_ENABLED: "${LAKEHOUSE_WRITE_ENABLED:-false}"
    GOLD_SOURCE_MODE: "${GOLD_SOURCE_MODE:-parquet_snapshot}"
    GOLD_ICEBERG_SOURCE_LINEAGE: "${GOLD_ICEBERG_SOURCE_LINEAGE:-}"
    WAREHOUSE_WRITE_ENABLED: "${WAREHOUSE_WRITE_ENABLED:-false}"
    CUSTOMERS_SILVER_SOURCE: "${CUSTOMERS_SILVER_SOURCE:-parquet}"
    CUSTOMERS_ICEBERG_CUTOVER_ENABLED: "${CUSTOMERS_ICEBERG_CUTOVER_ENABLED:-false}"
    PRODUCTS_SILVER_SOURCE: "${PRODUCTS_SILVER_SOURCE:-parquet}"
    PRODUCTS_ICEBERG_CUTOVER_ENABLED: "${PRODUCTS_ICEBERG_CUTOVER_ENABLED:-false}"
    ORDERS_SILVER_SOURCE: "${ORDERS_SILVER_SOURCE:-parquet}"
    ORDERS_ICEBERG_CUTOVER_ENABLED: "${ORDERS_ICEBERG_CUTOVER_ENABLED:-false}"
    ORDER_ITEMS_SILVER_SOURCE: "${ORDER_ITEMS_SILVER_SOURCE:-parquet}"
    ORDER_ITEMS_ICEBERG_CUTOVER_ENABLED: "${ORDER_ITEMS_ICEBERG_CUTOVER_ENABLED:-false}"
    PAYMENTS_SILVER_SOURCE: "${PAYMENTS_SILVER_SOURCE:-parquet}"
    PAYMENTS_ICEBERG_CUTOVER_ENABLED: "${PAYMENTS_ICEBERG_CUTOVER_ENABLED:-false}"
    SHIPMENTS_SILVER_SOURCE: "${SHIPMENTS_SILVER_SOURCE:-parquet}"
    SHIPMENTS_ICEBERG_CUTOVER_ENABLED: "${SHIPMENTS_ICEBERG_CUTOVER_ENABLED:-false}"

    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-api-server:8080/execution/"
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY}

    DB_HOST: postgres
    DB_PORT: "5432"
    DB_NAME: ${DB_NAME:-ecommerce_platform}
    DB_USER: ecommerce_user
    DB_PASSWORD: ${DB_PASSWORD}

    MINIO_ENDPOINT: ${MINIO_DOCKER_ENDPOINT:-minio:9000}
    MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
    MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    BRONZE_BUCKET: ${BRONZE_BUCKET}
    AIRFLOW_DOCKER_PROJECT_PATH: "${AIRFLOW_DOCKER_PROJECT_PATH:-${PWD}}"
    AIRFLOW_DOCKER_NETWORK: "${AIRFLOW_DOCKER_NETWORK:-${COMPOSE_PROJECT_NAME:-ecommerce-data-platform}_default}"
    SPARK_IMAGE: "${SPARK_IMAGE:-ecommerce-spark:3.5.6}"
    DBT_RUNNER_IMAGE: "${DBT_RUNNER_IMAGE:-ecommerce-data-platform-dbt-runner:latest}"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/bootstrap_auth.py:/opt/airflow/bootstrap_auth.py:ro
    - airflow_auth:/opt/airflow/auth
    - ./ingestion:/opt/airflow/project/ingestion
    - ./validation:/opt/airflow/project/validation
    - ./source:/opt/airflow/project/source
    - ./common:/opt/airflow/project/common:ro
    - ./silver:/opt/airflow/project/silver:ro
    - ./gold:/opt/airflow/project/gold:ro
    - ./lakehouse:/opt/airflow/project/lakehouse:ro
    - ./transformation:/opt/airflow/project/transformation:ro
    - ./staging:/opt/airflow/project/staging
services:
  postgres:
    image: postgres:16
    container_name: ecommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ecommerce_platform}
      POSTGRES_USER: ecommerce_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AIRFLOW_DB_NAME: ${AIRFLOW_DB_NAME:-airflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./source/database/00-create-airflow-database.sh:/docker-entrypoint-initdb.d/00-create-airflow-database.sh:ro
      - ./source/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: ecommerce-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD:  ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  nessie:
    image: ${NESSIE_IMAGE:-ghcr.io/projectnessie/nessie:0.108.8}
    container_name: ecommerce-nessie
    # The named volume is created as root by Docker Desktop; run the local
    # single-node catalog as root so RocksDB can initialize its first files.
    user: "0:0"
    restart: unless-stopped
    environment:
      NESSIE_VERSION_STORE_TYPE: ROCKSDB
      NESSIE_VERSION_STORE_PERSIST_ROCKS_DATABASE_PATH: /var/lib/nessie
      NESSIE_CATALOG_DEFAULT_WAREHOUSE: lakehouse
      NESSIE_CATALOG_WAREHOUSES_LAKEHOUSE_LOCATION: s3a://${BRONZE_BUCKET}/lakehouse
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_ENDPOINT: http://minio:9000
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_PATH_STYLE_ACCESS: "true"
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_REGION: us-east-1
      NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_REMOTE_SIGNING_ENABLED: "false"
      # Nessie REST Catalog requires object-store credentials to be resolved
      # through its secret provider rather than supplied as plaintext options.
      JAVA_OPTS_APPEND: >-
        -Dnessie.catalog.service.s3.default-options.access-key=urn:nessie-secret:quarkus:minio-credentials
        -Dminio-credentials.name=${MINIO_ACCESS_KEY}
        -Dminio-credentials.secret=${MINIO_SECRET_KEY}
    ports:
      - "19120:19120"
    healthcheck:
      # Nessie 0.108 exposes its version-store configuration at this endpoint.
      # A successful response proves the HTTP server and RocksDB store are ready.
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:19120/api/v2/config >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    volumes:
      - nessie_data:/var/lib/nessie
    depends_on:
      - minio

  dbt-runner:
    build:
      context: .
      dockerfile: warehouse/dbt.Dockerfile
    environment:
      DBT_PROFILES_DIR: /app/profiles
      DBT_HOST: postgres
      DBT_PORT: "5432"
      DBT_NAME: ${DB_NAME:-ecommerce_platform}
      DBT_USER: ${DB_USER}
      DBT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./warehouse/ecommerce_dbt:/app
      - ./warehouse/dbt_profiles:/app/profiles:ro
    working_dir: /app
    depends_on:
      - postgres
    profiles:
      - dbt

  airflow-init:
    <<: *airflow-common
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        mkdir -p /opt/airflow/logs
        chown 50000:0 /opt/airflow/logs
        chmod 775 /opt/airflow/logs
        python /opt/airflow/bootstrap_auth.py
        PYTHONPATH=/home/airflow/.local/lib/python3.12/site-packages exec airflow db migrate
    volumes:
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/bootstrap_auth.py:/opt/airflow/bootstrap_auth.py:ro
      - airflow_auth:/opt/airflow/auth
      - ./staging:/opt/airflow/project/staging
    depends_on:
      - postgres

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "8085:8080"
    volumes:
    - ./staging:/opt/airflow/project/staging
    - ./airflow/bootstrap_auth.py:/opt/airflow/bootstrap_auth.py:ro
    - airflow_auth:/opt/airflow/auth
    depends_on:
      airflow-init:
        condition: service_completed_successfully
  airflow-scheduler:
    <<: *airflow-common
    environment:
      <<: *airflow-common-env
      WAREHOUSE_WRITE_ENABLED: "${WAREHOUSE_WRITE_ENABLED:-false}"
      GOLD_SNAPSHOT_WRITE_ENABLED: "${GOLD_SNAPSHOT_WRITE_ENABLED:-false}"
      WAREHOUSE_DB_HOST: postgres
      WAREHOUSE_DB_PORT: ${DB_PORT}
      WAREHOUSE_DB_NAME: ${DB_NAME}
      WAREHOUSE_DB_USER: ${DB_USER}
      WAREHOUSE_DB_PASSWORD: ${DB_PASSWORD}
    command: scheduler
    volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/bootstrap_auth.py:/opt/airflow/bootstrap_auth.py:ro
    - airflow_auth:/opt/airflow/auth
    - ./ingestion:/opt/airflow/project/ingestion
    - ./validation:/opt/airflow/project/validation
    - ./source:/opt/airflow/project/source
    - ./common:/opt/airflow/project/common:ro
    - ./silver:/opt/airflow/project/silver:ro
    - ./gold:/opt/airflow/project/gold:ro
    - ./lakehouse:/opt/airflow/project/lakehouse:ro
    - ./transformation:/opt/airflow/project/transformation:ro
    - /var/run/docker.sock:/var/run/docker.sock
    - ./staging:/opt/airflow/project/staging
    - ./warehouse:/opt/airflow/project/warehouse:ro
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:

    <<: *airflow-common
    environment:
      <<: *airflow-common-env
      WAREHOUSE_DB_HOST: postgres
      WAREHOUSE_DB_PORT: ${DB_PORT}
      WAREHOUSE_DB_NAME: ${DB_NAME}
      WAREHOUSE_DB_USER: ${DB_USER}
      WAREHOUSE_DB_PASSWORD: ${DB_PASSWORD}
    command: dag-processor
    volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/bootstrap_auth.py:/opt/airflow/bootstrap_auth.py:ro
    - airflow_auth:/opt/airflow/auth
    - ./ingestion:/opt/airflow/project/ingestion:ro
    - ./validation:/opt/airflow/project/validation:ro
    - ./source:/opt/airflow/project/source:ro
    - ./common:/opt/airflow/project/common:ro
    - ./silver:/opt/airflow/project/silver:ro
    - ./gold:/opt/airflow/project/gold:ro
    - ./lakehouse:/opt/airflow/project/lakehouse:ro
    - ./transformation:/opt/airflow/project/transformation:ro
    - ./staging:/opt/airflow/project/staging
    depends_on:
      airflow-init:
        condition: service_completed_successfully
volumes:
  postgres_data:
  minio_data:
  airflow_auth:
  nessie_data:
